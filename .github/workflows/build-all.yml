name: build-all

on:
  push:
  workflow_dispatch:

jobs:
  # ==================================================================
  # ۱) ساخت MDavariVPN.exe روی ویندوز
  # ==================================================================
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v5

      - name: پیدا کردن محل پروژه
        id: proj
        shell: bash
        run: |
          if [ -f "main.py" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "MDavariVPN/main.py" ]; then
            echo "dir=MDavariVPN" >> "$GITHUB_OUTPUT"
          else
            echo "::error::فایل main.py پیدا نشد"; ls -la; exit 1
          fi

      - name: نصب پایتون
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: نصب PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: ساخت فایل اجرایی
        shell: pwsh
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          $extra = @()
          if (Test-Path "app/ui/icon.ico") { $extra = @("--icon", "app/ui/icon.ico") }
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name MDavariVPN @extra --add-data "app;app" main.py

      - name: بارگذاری خروجی
        uses: actions/upload-artifact@v4
        with:
          name: MDavariVPN-windows
          path: ${{ steps.proj.outputs.dir }}/dist/MDavariVPN.exe
          if-no-files-found: error

  # ==================================================================
  # ۲) ساخت app-debug.apk برای اندروید
  # ==================================================================
  android-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: دریافت کد
        uses: actions/checkout@v5

      - name: پیدا کردن محل پروژه
        id: proj
        shell: bash
        run: |
          if [ -d "android" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -d "MDavariVPN/android" ]; then
            echo "dir=MDavariVPN" >> "$GITHUB_OUTPUT"
          else
            echo "::error::پوشه‌ی android پیدا نشد"; ls -la; exit 1
          fi

      - name: نصب جاوا ۱۷
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ✂ این مرحله جای اکشن خرابِ setup-android را گرفته:
      # رانرهای گیت‌هاب خودشان Android SDK دارند، فقط پکیج‌های لازم را کامل می‌کنیم.
      # اگر هم این مرحله شکست بخورد، بیلد متوقف نمی‌شود (continue-on-error).
      - name: آماده‌سازی Android SDK (روی ماشین از قبل نصب است)
        continue-on-error: true
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK"
          ls -la "$SDK" || true

          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          fi
          echo "sdkmanager = ${SDKM:-پیدا نشد}"

          if [ -n "$SDKM" ]; then
            (yes | "$SDKM" --licenses > /dev/null 2>&1) || true
            "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
            echo "---- پکیج‌های نصب‌شده ----"
            "$SDKM" --list_installed 2>/dev/null | head -40 || true
          fi

          echo "---- پوشه‌های SDK ----"
          ls "$SDK/platforms" 2>/dev/null || true
          ls "$SDK/build-tools" 2>/dev/null || true

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: تنظیم مسیر SDK برای Gradle
        working-directory: ${{ steps.proj.outputs.dir }}/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.builder.sdkDownload=true" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34" >> gradle.properties
          echo "---- gradle.properties ----"; cat gradle.properties

      - name: ساخت APK دیباگ
        working-directory: ${{ steps.proj.outputs.dir }}/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: بارگذاری خروجی
        uses: actions/upload-artifact@v4
        with:
          name: MDavariVPN-android-apk
          path: ${{ steps.proj.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
